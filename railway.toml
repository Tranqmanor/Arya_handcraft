# Railway 配置(config as code):https://docs.railway.app/reference/config-as-code
[build]
builder = "DOCKERFILE"
buildContext = "server"
dockerfilePath = "Dockerfile"

[deploy]
# 健康检查:已在全新服务(inspiring-spirit-arya)上恢复验证。
# 历史旧服务因平台编排坏状态探活持续 503,已由新服务替代。
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# 注意:容器目标端口(Target Port=8000)在 Dashboard → Settings → Networking 中设置;
# railway.toml 没有 services/port 段,之前文件里的 [[services]] 写法无效已被移除。
