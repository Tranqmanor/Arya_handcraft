# Railway 配置(config as code):https://docs.railway.app/reference/config-as-code
[build]
builder = "DOCKERFILE"
buildContext = "server"
dockerfilePath = "Dockerfile"

[deploy]
# 健康检查暂时停用:应用与公网均正常(见 /api/v1/health),但平台内部探活持续 503,
# 已确认 Target Port 正确(magic detected 8000)、无崩溃、DB 连通——疑似平台编排问题,
# 已联系 Railway 支持(附诊断材料)。结论出来前保持停用,避免每次部署标记 FAILED。
# healthcheckPath = "/api/v1/health"
# healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# 注意:容器目标端口(Target Port=8000)在 Dashboard → Settings → Networking 中设置;
# railway.toml 没有 services/port 段,之前文件里的 [[services]] 写法无效已被移除。
