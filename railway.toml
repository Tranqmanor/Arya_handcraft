# Railway 配置(config as code):https://docs.railway.app/reference/config-as-code
[build]
builder = "DOCKERFILE"
buildContext = "server"
dockerfilePath = "Dockerfile"

[deploy]
# 健康检查临时停用(第二次):端口已被 Railway magic 正确检测为 8000(uvicorn),
# 探活仍持续 503,高度疑似平台编排坏状态;服务经公网实测完全正常。
# 后续处理:重建服务或联系 Railway 支持后,取消下面两行注释即可恢复。
# healthcheckPath = "/api/v1/health"
# healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# 注意:容器目标端口(Target Port=8000)在 Dashboard → Settings → Networking 中设置;
# railway.toml 没有 services/port 段,之前文件里的 [[services]] 写法无效已被移除。
