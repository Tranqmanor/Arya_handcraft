# Railway 配置(config as code):https://docs.railway.app/reference/config-as-code
[build]
builder = "DOCKERFILE"
buildContext = "server"
dockerfilePath = "Dockerfile"

[deploy]
# 健康检查:通过后才切流。
# 历史:曾因平台编排坏状态持续 503 而临时停用;重新 Generate Domain 刷新端口绑定后恢复。
# 若再次出现全量 503,优先按 docs/cloudflare-pages.md 排查,必要时注释以下两行回退。
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# 注意:容器目标端口(Target Port=8000)在 Dashboard → Settings → Networking 中设置;
# railway.toml 没有 services/port 段,之前文件里的 [[services]] 写法无效已被移除。
