# Railway 配置(config as code):https://docs.railway.app/reference/config-as-code
[build]
builder = "DOCKERFILE"
buildContext = "server"
dockerfilePath = "Dockerfile"

[deploy]
# 健康检查已临时停用:Railway 内部探活持续 503(Target Port 绑定待修),
# 但服务经公网实测正常(/api/v1/health 返回 ok)。
# 待 Public Networking 中域名端口确认为 8000 后,取消下行注释即可恢复。
# healthcheckPath = "/api/v1/health"
# healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

# 注意:容器目标端口(Target Port=8000)在 Dashboard → Settings → Networking 中设置;
# railway.toml 没有 services/port 段,之前文件里的 [[services]] 写法无效已被移除。
