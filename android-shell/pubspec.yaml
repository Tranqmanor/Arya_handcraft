name: arya_admin_app
description: Arya手作管理 App(WebView 壳,离线本地订单 + 在线后台)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 固定版本,避免 ^ 解析到未验证的新版引入不确定性(4.8.0 含 setWebContentsDebuggingEnabled)
  webview_flutter: 4.8.0
  webview_flutter_android: 3.16.2
  path_provider: 2.1.4
  share_plus: 9.0.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# App 图标生成:dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icons_src/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - webapp/
    - webapp/icons/